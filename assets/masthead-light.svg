<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 126" width="850" height="126" role="img" aria-label="Nguyen Minh Hieu">
  <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="600" letter-spacing="-1.2" fill="#111315">Nguyen Minh Hieu</text>

  <!-- Swiss drafting registration mark (aligned to cap-height) -->
  <line x1="780" y1="40" x2="824" y2="40" stroke="#8C959F" stroke-width="1.8"/>
  <line x1="810" y1="33" x2="810" y2="47" stroke="#8C959F" stroke-width="1.8"/>
  <rect x="836" y="33" width="14" height="14" fill="#9A5B37"/>

  <!-- Asymmetric 4-segment architectural baseline (140 / 260 / 240 / 180 + 3x10px gaps = 850) -->
  <line x1="0"   y1="112" x2="140" y2="112" stroke="#9A5B37"   stroke-width="2.6"/>
  <line x1="150" y1="112" x2="410" y2="112" stroke="#D0D7DE" stroke-width="2"/>
  <line x1="420" y1="112" x2="660" y2="112" stroke="#D0D7DE" stroke-width="2"/>
  <line x1="670" y1="112" x2="850" y2="112" stroke="#D0D7DE" stroke-width="2"/>

  <!-- Drafting segment end-ticks -->
  <line x1="140" y1="107" x2="140" y2="117" stroke="#9A5B37"   stroke-width="1.8"/>
  <line x1="410" y1="108" x2="410" y2="116" stroke="#D0D7DE" stroke-width="1.5"/>
  <line x1="660" y1="108" x2="660" y2="116" stroke="#D0D7DE" stroke-width="1.5"/>
</svg>
