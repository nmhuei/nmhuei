<svg xmlns="http://www.w3.org/2000/svg" width="900" height="66" viewBox="0 0 900 66" role="img" aria-label="Stay curious, stay disciplined">
  <defs>
    <linearGradient id="waveGrad1-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A7F37" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0969DA" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8250DF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="waveStroke-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A7F37" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0969DA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8250DF" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="clipFoot-light">
      <rect x="1" y="1" width="898" height="64" rx="12"/>
    </clipPath>
    <style>
      @keyframes drift { 0% { transform: translateX(0px); } 100% { transform: translateX(-300px); } }
      .w1 { animation: drift 10s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#clipFoot-light)">
    <rect x="0" y="0" width="900" height="66" fill="#F8FAFC"/>
    <g class="w1">
      <path d="M 0 48 Q 75 36 150 48 T 300 48 T 450 48 T 600 48 T 750 48 T 900 48 T 1050 48 T 1200 48 V 66 H 0 Z" fill="url(#waveGrad1-light)"/>
      <path d="M 0 48 Q 75 36 150 48 T 300 48 T 450 48 T 600 48 T 750 48 T 900 48 T 1050 48 T 1200 48" fill="none" stroke="url(#waveStroke-light)" stroke-width="1.4"/>
    </g>
    <text x="450" y="26" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#57606A" letter-spacing="2.2">STAY CURIOUS · STAY DISCIPLINED</text>
  </g>
  <rect x="1" y="1" width="898" height="64" rx="12" fill="none" stroke="#D0D7DE" stroke-width="1"/>
</svg>
