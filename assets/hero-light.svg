<svg xmlns="http://www.w3.org/2000/svg" width="900" height="224" viewBox="0 0 900 224" role="img" aria-label="Hi, I'm Hieu - Cyber Security Student">
  <defs>
    <pattern id="dots-light" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.05" fill="#CBD5E1" opacity="0.55"/>
    </pattern>
    <radialGradient id="glowA-light" cx="82%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#2DA44E" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#0969DA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB-light" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A7F37"/>
      <stop offset="50%" stop-color="#0969DA"/>
      <stop offset="100%" stop-color="#8250DF"/>
    </linearGradient>
    <clipPath id="clipHero-light">
      <rect x="1" y="1" width="898" height="222" rx="16"/>
    </clipPath>
    <style>
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      .cursor { animation: blink 1.1s step-end infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .orbit1 { transform-origin: 752px 112px; animation: spinSlow 28s linear infinite; }
      .orbit2 { transform-origin: 752px 112px; animation: spinRev 19s linear infinite; }
      .float { animation: floatY 4.2s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#clipHero-light)">
    <rect x="0" y="0" width="900" height="224" fill="#F8FAFC"/>
    <rect x="0" y="0" width="900" height="224" fill="url(#dots-light)"/>
    <rect x="0" y="0" width="900" height="224" fill="url(#glowA-light)"/>
    <rect x="0" y="0" width="900" height="224" fill="url(#glowB-light)"/>

    <!-- Top accent bar -->
    <rect x="0" y="0" width="900" height="3.5" fill="url(#accentLine-light)"/>

    <!-- Decorative right-side geometric cyber emblem -->
    <g opacity="0.92">
      <circle cx="752" cy="112" r="76" fill="none" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="4 6"/>
      <circle cx="752" cy="112" r="54" fill="none" stroke="#0969DA" stroke-opacity="0.38" stroke-width="1.2"/>
      <circle cx="752" cy="112" r="32" fill="#F1F5F9" stroke="#1A7F37" stroke-opacity="0.65" stroke-width="1.4"/>

      <!-- Rotating orbit rings -->
      <g class="orbit1">
        <circle cx="752" cy="36" r="4" fill="#1A7F37"/>
        <circle cx="828" cy="112" r="3" fill="#0969DA"/>
        <circle cx="676" cy="112" r="2.5" fill="#8250DF"/>
      </g>
      <g class="orbit2">
        <path d="M 752 58 A 54 54 0 0 1 806 112" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round"/>
        <path d="M 752 166 A 54 54 0 0 1 698 112" fill="none" stroke="#8250DF" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- Center crisp hex / shield motif -->
      <g class="float">
        <polygon points="752,92 769,102 769,122 752,132 735,122 735,102" fill="none" stroke="#1A7F37" stroke-width="1.8"/>
        <text x="752" y="117" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#1F2328">0x</text>
      </g>

      <!-- Subtle decorative hex labels -->
      <text x="752" y="203" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#6E7781" letter-spacing="1.8">HANOI · UTC+7</text>
    </g>

    <!-- Left main content -->
    <g transform="translate(42, 38)">
      <!-- Live status pill -->
      <rect x="0" y="0" width="212" height="24" rx="12" fill="#DAFBE1" stroke="#82E09B" stroke-width="1"/>
      <circle class="pulse" cx="15" cy="12" r="4" fill="#1A7F37"/>
      <text x="27" y="16" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#1A7F37" letter-spacing="0.4">NMHUEI // CYBER SECURITY</text>

      <!-- Main greeting -->
      <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#1F2328" letter-spacing="-0.8">Hi, I'm Hieu</text>
      <rect class="cursor" x="208" y="45" width="12" height="30" rx="2" fill="#1A7F37"/>

      <!-- Clean personal tagline -->
      <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#57606A">Breaking things to understand how they work — building systems to keep them safe.</text>

      <!-- Minimal personal chips -->
      <g transform="translate(0, 128)">
        <rect x="0" y="0" width="176" height="28" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
        <text x="88" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1F2328">USTH · Cyber Security</text>

        <rect x="188" y="0" width="146" height="28" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
        <text x="261" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0969DA">CTF · USTH_Ex0dia</text>

        <rect x="346" y="0" width="166" height="28" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
        <text x="429" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#8250DF">UCS · Technical Lead</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="222" rx="16" fill="none" stroke="#D0D7DE" stroke-width="1.2"/>
</svg>
